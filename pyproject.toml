[project]
name = "blastradius"
version = "0.1.0"
description = "Graph-native firewall for AI agents, built on FalkorDB"
requires-python = ">=3.11,<3.13"
dependencies = [
  "falkordb>=1.0.10",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "networkx>=3.3",
  "anthropic>=0.40",
  "httpx>=0.27",
  "typer>=0.12",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = ["no_db: test does not need FalkorDB", "db: test needs FalkorDB (default; explicit for clarity)"]

[tool.ruff]
line-length = 100
